name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to its release
        required: true

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      # build tooling always comes from the workflow's own commit, so older
      # tags (made before the tooling existed) can be packaged too
      - uses: actions/checkout@v7
        with:
          path: tools

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          path: src

      - name: Build package
        working-directory: src
        run: ../tools/packaging/ci-build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: src/dist/*.pkg.tar.zst

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" src/dist/*.pkg.tar.zst --clobber
